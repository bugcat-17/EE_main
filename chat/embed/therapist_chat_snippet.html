<div class="therapist-settings" style="margin-bottom: 10px;">
  <input type="text" id="therapistNicknameInput" placeholder="치료사 닉네임 입력">
  <button onclick="updateTherapistNickname()">이름 변경</button>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
<script>
(function () {
  const CHAT_SERVER = "https://ee-main.onrender.com"; [cite: 6]
  const socket = io(CHAT_SERVER, { transports: ["websocket", "polling"] });

  // 1. 치료사용 로컬 스토리지 키 (환자와 구분하기 위해 'therapist_' 접두어 사용)
  let currentNickname = localStorage.getItem("therapist_nickname");
  if (!currentNickname) {
      currentNickname = "치료사_" + Math.floor(Math.random() * 100);
      localStorage.setItem("therapist_nickname", currentNickname);
  }

  socket.on("connect", () => {
    // 2. 서버에 치료사 닉네임 등록 알림
    socket.emit("identify", { nickname: currentNickname }); [cite: 8]
    console.log("치료사 접속 완료:", currentNickname);
  });

  // 닉네임 수정 함수
  window.updateTherapistNickname = function() {
    const newName = document.getElementById('therapistNicknameInput').value.trim();
    if (newName) {
      currentNickname = newName;
      localStorage.setItem("therapist_nickname", newName); // 기기 저장
      socket.emit("set_nickname", newName);           // 서버 저장
      alert("치료사 이름이 '" + newName + "'으로 변경되었습니다.");
    }
  };

  // 3. 메시지를 보낼 때 현재 닉네임을 실어서 보냄 [cite: 15]
  window.sendChat = function (text) {
    if (!text) return;
    socket.emit("send_message", { 
      message: text,
      sender: currentNickname // 서버의 handle_send_message에서 사용할 이름 [cite: 16]
    });
  };

  socket.on("receive_message", (msg) => {
    console.log("수신:", msg); [cite: 14]
    // 여기서 화면에 메시지 출력
  });
})();
</script>
