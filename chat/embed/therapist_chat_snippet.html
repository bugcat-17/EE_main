<script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
<script>
  (function () {
    // ✨ 1. 서버 주소를 Render 주소로 변경
    const CHAT_SERVER = "https://ee-main.onrender.com";
    const roomId = "REPLACE_WITH_SAME_ROOM_ID_AS_PATIENT";
    const userId = "REPLACE_WITH_LOGGED_IN_THERAPIST_ID";

    let currentNickname = "치료사"; // 기본 닉네임 설정

    const socket = io(CHAT_SERVER, { transports: ["websocket", "polling"] });

    socket.on("connect", () => {
      socket.emit("identify", { user_id: userId, role: "therapist" });
      socket.emit("join_room", { room_id: roomId });
    });

    // ✨ 2. 바깥 창(index.html)에서 보낸 '닉네임 변경' 쪽지 받기
    window.addEventListener("message", function(event) {
      if (event.data && event.data.type === "UPDATE_NICKNAME") {
        currentNickname = event.data.nickname;
        console.log("치료사 화면 안쪽 닉네임 변경 완료:", currentNickname);
      }
    });

    socket.on("chat_message", (msg) => {
      console.log("수신:", msg);
      // TODO: DOM에 메시지 렌더링
    });

    socket.on("error", (err) => console.warn("채팅 오류:", err));

    // ✨ 3. 메시지를 보낼 때 현재 닉네임도 같이 보내기
    window.sendChat = function (text) {
      socket.emit("chat_message", { 
        room_id: roomId, 
        text: text,
        sender: currentNickname // 바뀐 닉네임 실어서 보내기
      });
    };
  })();
</script>
