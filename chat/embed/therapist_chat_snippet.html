<div class="therapist-settings" style="margin-bottom: 10px; padding: 10px; background: #f0f4f8; border-radius: 8px;">
    <strong>치료사 설정: </strong>
    <input type="text" id="therapistNicknameInput" placeholder="닉네임 입력 (예: 박선생님)">
    <button id="therapistNicknameBtn" onclick="changeTherapistNickname()">이름 변경 및 내역 불러오기</button>
  </div>
  
  <div id="patient-list-container" style="margin-bottom: 10px; padding: 10px; background: #e8f5e9; border-radius: 8px; border: 1px solid #c8e6c9;">
    <strong style="color: #2e7d32;">접속 중인 대기 환자:</strong>
    <ul id="patient-list" style="list-style: none; padding-left: 0; margin: 5px 0 0 0; font-size: 0.9em;">
        <li style="color: #666;">대기 중인 환자가 없습니다.</li>
    </ul>
  </div>
    
  <div id="chat-content" style="height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; background: #fff;">
  </div>
    
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
  <script>
  (function () {
      const CHAT_SERVER = "https://ee-main.onrender.com";
      const chatWindow = document.getElementById("chat-content");
      const therapistNicknameInput = document.getElementById('therapistNicknameInput');
      const therapistNicknameBtn = document.getElementById('therapistNicknameBtn');
      
      let myNickname = localStorage.getItem("therapist_nickname") || "치료사";
      let isChangingNickname = false;
      therapistNicknameInput.value = myNickname;
      
      const socket = io(CHAT_SERVER, { 
          transports: ["websocket", "polling"],
          reconnection: true
      });
  
      function appendChatMessage(nickname, message, isSystem = false) {
          if (!chatWindow) return;
          const msgTag = document.createElement("div");
          msgTag.style.marginBottom = "5px";
          
          if (isSystem) {
              msgTag.style.color = "#666";
              msgTag.style.fontSize = "0.85em";
              msgTag.style.fontStyle = "italic";
              msgTag.style.textAlign = "center";
              msgTag.style.padding = "5px 0";
              msgTag.textContent = message;
          } else {
              msgTag.innerHTML = `<strong>${nickname}:</strong> ${escapeHtml(message)}`;
          }
          chatWindow.appendChild(msgTag);
          chatWindow.scrollTop = chatWindow.scrollHeight;
      }
  
      function escapeHtml(text) {
          return text.replace(/[&<>"']/g, m => ({'&': '&amp;','<': '&lt;','>': '&gt;','"': '&quot;',"'": '&#039;'}[m]));
      }
  
      // ✅ 연결 성공 (역할 명시)
      socket.on("connect", () => {
          console.log("✅ 치료사 접속 완료:", myNickname);
          // 역할을 'therapist'로 전달
          socket.emit("identify", { nickname: myNickname, role: "therapist" });
          appendChatMessage('📡 시스템', '서버에 연결되었습니다. 환자 목록을 기다립니다.', true);
      });
  
      // ✅ 대기 중인 환자 목록 수신 (서버로부터 실시간 업데이트)
      socket.on("update_patient_list", (patients) => {
          const listEl = document.getElementById("patient-list");
          listEl.innerHTML = "";
          
          if (patients.length === 0) {
              listEl.innerHTML = '<li style="color: #666;">대기 중인 환자가 없습니다.</li>';
              return;
          }
          
          patients.forEach(p => {
              const li = document.createElement("li");
              li.style.marginBottom = "5px";
              // 환자 옆에 [상담 시작] 버튼 생성
              li.innerHTML = `
                <span style="display:inline-block; width:120px;">👤 ${escapeHtml(p.nickname)}</span> 
                <button onclick="requestMatch('${p.sid}')" style="background:#2e7d32; color:white; border:none; padding:3px 8px; border-radius:4px; cursor:pointer; font-size:0.8em;">상담 시작</button>
              `;
              listEl.appendChild(li);
          });
      });
  
      // ✅ 매칭 요청 버튼 함수 (글로벌에서 접근 가능하도록 설정)
      window.requestMatch = function(patientSid) {
          if (!socket.connected) {
              alert("서버 연결이 끊어져 매칭할 수 없습니다.");
              return;
          }
          socket.emit("request_match", { target_sid: patientSid });
      };
  
      // ✅ 매칭 성공 수신
      socket.on("match_success", (data) => {
          appendChatMessage('🤝 시스템', data.message, true);
      });
  
      socket.on("receive_message", (data) => {
          appendChatMessage(data.nickname, data.message, false);
      });
  
      socket.on("disconnect", () => {
          appendChatMessage('📡 시스템', '서버와의 연결이 끊어졌습니다', true);
      });
  
      window.sendChat = function (text) {
          if (!text || text.trim() === "" || !socket.connected) return;
          socket.emit("send_message", { message: text.trim() });
      };
  
      window.changeTherapistNickname = function() {
          const newName = therapistNicknameInput.value.trim();
          if (!newName || newName === myNickname || isChangingNickname) return;
  
          isChangingNickname = true;
          therapistNicknameBtn.disabled = true;
          therapistNicknameBtn.textContent = '변경 중...';
  
          const oldNickname = myNickname;
          myNickname = newName;
          localStorage.setItem("therapist_nickname", newName);
          
          appendChatMessage('📝 시스템', `닉네임이 '${oldNickname}'에서 '${newName}'으로 변경되었습니다`, true);
          socket.emit("set_nickname", newName);
          
          isChangingNickname = false;
          therapistNicknameBtn.disabled = false;
          therapistNicknameBtn.textContent = '이름 변경 및 내역 불러오기';
      };
  })();
  </script>
