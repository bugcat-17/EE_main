<script>
  (function () {
      const CHAT_SERVER = "https://ee-main.onrender.com";
      const socket = io(CHAT_SERVER, { transports: ["websocket", "polling"] });
  
      // [중요] 실행되자마자 로컬 스토리지에서 닉네임부터 가져옴
      let myNickname = localStorage.getItem("saved_nickname") || "익명객체";
      
      socket.on("connect", () => {
          // 연결 즉시 서버에 닉네임 전달 -> 서버는 이걸 받고 과거 내역을 쏴줌
          socket.emit("identify", { nickname: myNickname });
      });
  
      // 메시지 전송 함수 (이름을 sendChat으로 통일) [cite: 11]
      window.sendChat = function (text) {
          if (!text || text.trim() === "") return;
          // 서버의 handle_send_message가 'message' 키를 기다림 [cite: 4]
          socket.emit("send_message", { message: text }); 
      };
  
      // 메시지 수신 (과거 내역 + 실시간 메시지 공용) [cite: 10]
      socket.on("receive_message", (data) => {
          const chatWindow = document.getElementById("chat-content"); // 실제 채팅창 ID로 변경하세요
          if (chatWindow) {
              const msgTag = document.createElement("div");
              msgTag.innerHTML = `<b>${data.nickname}:</b> ${data.message}`;
              chatWindow.appendChild(msgTag);
              chatWindow.scrollTop = chatWindow.scrollHeight; // 스크롤 하단 이동
          }
      });
  
      // 닉네임 변경 기능
      window.changeMyNickname = function() {
          const newName = document.getElementById('nicknameInput').value.trim();
          if (newName) {
              myNickname = newName;
              localStorage.setItem("saved_nickname", newName); // 새로고침 대비 저장
              socket.emit("set_nickname", newName);
              location.reload(); // 과거 내역 닉네임 동기화를 위해 새로고침 추천
          }
      };
  })();
  </script>
