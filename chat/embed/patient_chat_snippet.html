<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>환자 채팅 (1:1 매칭 적용)</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
  <style>
    /* 기존 스타일 그대로 유지 */
    :root { 
      --bg: #0f1419; --panel: #1a2332; --border: #2d3a4d; 
      --text: #e7ecf3; --muted: #8b9cb3; --accent: #3d8bfd; 
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: "Segoe UI", sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
    header { padding: 0.85rem 1rem; border-bottom: 1px solid var(--border); background: var(--panel); }
    header h1 { margin: 0; font-size: 1rem; display: inline-block; }
    .nickname-area { margin-top: 5px; display: flex; gap: 5px; align-items: center; }
    .nickname-area input { background: #000; border: 1px solid var(--border); color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; flex: 1; max-width: 200px; }
    .nickname-area button { font-size: 0.7rem; cursor: pointer; background: var(--accent); color: white; border: none; border-radius: 4px; padding: 4px 10px; font-weight: 600; transition: opacity 0.2s ease; }
    .nickname-area button:hover { opacity: 0.8; }
    .nickname-area button:disabled { opacity: 0.5; cursor: not-allowed; }
    .log { flex: 1; overflow-y: auto; padding: 0.75rem 1rem; font-size: 0.88rem; }
    .row { margin-bottom: 0.5rem; line-height: 1.4; }
    .meta { color: var(--muted); font-size: 0.75rem; text-align: center; margin: 10px 0; padding: 5px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .me { color: #c4b5fd; text-align: right; background: rgba(196, 181, 253, 0.1); padding: 4px 8px; border-radius: 4px; }
    .composer { border-top: 1px solid var(--border); padding: 0.65rem; display: flex; gap: 0.5rem; background: var(--panel); }
    .composer input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 0.5rem; }
    .composer button { background: var(--accent); border: none; color: #fff; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-weight: 600; transition: opacity 0.2s ease; }
    .composer button:hover { opacity: 0.85; }
    .composer button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { float: right; font-size: 0.75rem; padding: 0.3rem 0.5rem; border-radius: 3px; background: rgba(255, 107, 107, 0.2); color: #ff6b6b; }
    .status.ok { background: rgba(110, 231, 183, 0.2); color: #6ee7b7; }
    .status.waiting { background: rgba(255, 204, 0, 0.2); color: #ffd700; } /* 대기 중 상태 컬러 추가 */
  </style>
</head>
<body>
  <header>
    <h1>환자 채팅</h1>
    <span class="status" id="st">연결 중…</span>
    <div class="nickname-area">
      <input type="text" id="nicknameInput" placeholder="닉네임 입력">
      <button id="nicknameBtn" onclick="changeNickname()">변경</button>
    </div>
  </header>

  <div class="log" id="log"></div>

  <form class="composer" id="form">
    <input type="text" id="input" placeholder="메시지 입력..." autocomplete="off" />
    <button type="submit" id="sendBtn">전송</button>
  </form>

  <script>
    const CHAT_ORIGIN = "https://ee-main.onrender.com"; 
    const logEl = document.getElementById("log");
    const st = document.getElementById("st");
    const input = document.getElementById("input");
    const nicknameInput = document.getElementById("nicknameInput");
    const nicknameBtn = document.getElementById("nicknameBtn");
    const sendBtn = document.getElementById("sendBtn");
    const form = document.getElementById("form");

    let myNickname = localStorage.getItem("saved_nickname") || ("환자_" + Math.floor(Math.random() * 1000));
    nicknameInput.value = myNickname;
    localStorage.setItem("saved_nickname", myNickname);
    let isChangingNickname = false;

    const socket = io(CHAT_ORIGIN, { transports: ["websocket", "polling"] });

    function appendLog(nickname, text, isMe = false, isMeta = false) {
      const row = document.createElement("div");
      if (isMeta) {
        row.className = "row meta"; row.textContent = text;
      } else {
        row.className = "row" + (isMe ? " me" : "");
        row.innerHTML = `<strong>${nickname}:</strong> ${escapeHtml(text)}`;
      }
      logEl.appendChild(row);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, m => ({'&': '&amp;','<': '&lt;','>': '&gt;','"': '&quot;',"'": '&#039;'}[m]));
    }

    socket.on("connect", function () {
      st.textContent = "대기실 접속됨 (" + myNickname + ")";
      st.className = "status waiting";
      // ✅ 역할을 'patient'로 명시하여 서버에 전달
      socket.emit("identify", { nickname: myNickname, role: "patient" });
      appendLog('📡 시스템', '서버에 연결되었습니다. 상담사 연결을 대기 중입니다.', false, true);
    });

    // ✅ 매칭 성공 시 이벤트
    socket.on("match_success", function(data) {
      st.textContent = "상담 중 (" + myNickname + ")";
      st.className = "status ok";
      appendLog('🤝 시스템', data.message, false, true);
    });

    socket.on("receive_message", function (data) {
      appendLog(data.nickname, data.message, data.nickname === myNickname, false);
    });

    socket.on("disconnect", () => {
      st.textContent = "연결 끊김"; st.className = "status err";
      appendLog('📡 시스템', '서버와의 연결이 끊어졌습니다', false, true);
      disableInputs(true);
    });

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const t = input.value.trim();
      if (!t || !socket.connected) return;
      socket.emit("send_message", { message: t });
      input.value = "";
    });

    window.changeNickname = function() {
      const newName = nicknameInput.value.trim();
      if (!newName || newName === myNickname || isChangingNickname) return;
      isChangingNickname = true; disableInputs(true); nicknameBtn.textContent = '변경 중...';

      const oldNickname = myNickname;
      myNickname = newName;
      localStorage.setItem("saved_nickname", newName);
      
      appendLog('📝 시스템', `닉네임이 '${oldNickname}'에서 '${newName}'으로 변경되었습니다`, false, true);
      socket.emit("set_nickname", newName);
      
      st.textContent = st.textContent.replace(oldNickname, newName);
      
      isChangingNickname = false; nicknameBtn.textContent = '변경'; disableInputs(false);
    };

    function disableInputs(disabled) {
      input.disabled = disabled; sendBtn.disabled = disabled;
      nicknameInput.disabled = disabled; nicknameBtn.disabled = disabled;
    }
  </script>
</body>
</html>
