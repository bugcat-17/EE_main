<!-- 기존 환자 사이트에 붙일 때: 아래 스크립트만 채팅 영역 근처에 포함 -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
<script>
  (function () {
    const CHAT_SERVER = "https://ee-main.onrender.com"; // Render 주소로 변경!
    const roomId = "REPLACE_WITH_ROOM_ID_FROM_YOUR_BACKEND";
    const userId = "REPLACE_WITH_LOGGED_IN_PATIENT_ID";
    
    let currentNickname = "환자"; // 기본 닉네임 설정

    const socket = io(CHAT_SERVER, { transports: ["websocket", "polling"] });

    socket.on("connect", () => {
      socket.emit("identify", { user_id: userId, role: "patient" });
      socket.emit("join_room", { room_id: roomId });
    });

    // ✨ 바깥 창에서 보낸 '닉네임 변경' 쪽지 받기
    window.addEventListener("message", function(event) {
      if (event.data && event.data.type === "UPDATE_NICKNAME") {
        currentNickname = event.data.nickname;
        console.log("iframe 안쪽 닉네임 변경 완료:", currentNickname);
      }
    });

    socket.on("chat_message", (msg) => {
      console.log("수신:", msg);
      // TODO: DOM에 메시지 렌더링
    });

    socket.on("error", (err) => console.warn("채팅 오류:", err));

    // ✨ 메시지를 보낼 때 현재 닉네임도 같이 보내기
    window.sendChat = function (text) {
      socket.emit("chat_message", { 
        room_id: roomId, 
        text: text,
        sender: currentNickname // 바뀐 닉네임 실어서 보내기!
      });
    };
  })();
</script>
