<div class="chat-nickname-container">
  <input type="text" id="nicknameInput" placeholder="닉네임 입력" style="padding:5px;">
  <button onclick="changeMyNickname()">닉네임 변경</button>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
<script>
  (function () {
    const CHAT_SERVER = "https://ee-main.onrender.com";
    const socket = io(CHAT_SERVER, { transports: ["websocket", "polling"] });

    // 1. 자동 닉네임 부여 (기기 저장소 확인)
    let myNickname = localStorage.getItem("saved_nickname");
    if (!myNickname) {
      myNickname = "환자_" + Math.random().toString(36).substring(2, 6);
      localStorage.setItem("saved_nickname", myNickname);
    }

    socket.on("connect", () => {
      // 2. 접속 시 내 닉네임을 서버에 알림
      socket.emit("identify", { nickname: myNickname });
    });

    // 닉네임 변경 함수
    window.changeMyNickname = function() {
      const newName = document.getElementById('nicknameInput').value.trim();
      if (newName) {
        myNickname = newName;
        localStorage.setItem("saved_nickname", newName); // 기기에 저장
        socket.emit("set_nickname", newName);           // 서버에 반영
        alert("닉네임이 '" + newName + "'으로 변경되었습니다.");
      }
    };

    // 메시지 수신 로직 [cite: 10]
    socket.on("receive_message", (msg) => {
      console.log(`${msg.nickname}: ${msg.message}`);
      // 여기에 채팅 UI에 메시지를 추가하는 DOM 코드를 넣으세요.
    });

    // 메시지 전송 로직 [cite: 12]
    window.sendChat = function (text) {
      if (!text) return;
      socket.emit("send_message", { 
        message: text
      });
    };
  })();
</script>
