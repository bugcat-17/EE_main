<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>환자 채팅</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
  <style>
    :root { --bg: #0f1419; --panel: #1a2332; --border: #2d3a4d; --text: #e7ecf3; --muted: #8b9cb3; --accent: #3d8bfd; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
    header { padding: 0.85rem 1rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; background: var(--panel); }
    header h1 { margin: 0; font-size: 1rem; }
    .badge { font-size: 0.7rem; padding: 0.2rem 0.45rem; border-radius: 4px; background: rgba(61, 139, 253, 0.25); color: #9ec5ff; }
    .status { font-size: 0.75rem; margin-left: auto; padding: 0.3rem 0.5rem; border-radius: 3px; background: rgba(255, 107, 107, 0.2); color: #ff6b6b; }
    .status.ok { background: rgba(61, 139, 253, 0.2); color: #9ec5ff; }
    .log { flex: 1; overflow-y: auto; padding: 0.75rem 1rem; font-size: 0.88rem; }
    .row { margin-bottom: 0.6rem; line-height: 1.4; }
    .me { color: #9ec5ff; text-align: right; background: rgba(61, 139, 253, 0.1); padding: 4px 8px; border-radius: 4px; }
    .meta { color: var(--muted); font-size: 0.75rem; text-align: center; margin: 10px 0; padding: 5px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .composer { border-top: 1px solid var(--border); padding: 0.65rem; display: flex; gap: 0.5rem; background: var(--panel); }
    .composer input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 0.5rem; }
    .composer button { background: var(--accent); border: none; color: #fff; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>환자 모드</h1>
    <span class="badge">patient</span>
    <span class="status" id="st">연결 중…</span>
  </header>
  <div class="log" id="log"></div>
  <form class="composer" id="form">
    <input type="text" id="input" placeholder="메시지 입력 후 Enter" autocomplete="off" />
    <button type="submit">보내기</button>
  </form>

  <script>
    const CHAT_ORIGIN = "https://ee-main.onrender.com"; 
    const logEl = document.getElementById("log"), st = document.getElementById("st");
    const input = document.getElementById("input"), form = document.getElementById("form");

    let myNickname = localStorage.getItem("patient_nickname") || ("환자_" + Math.floor(Math.random() * 1000));
    localStorage.setItem("patient_nickname", myNickname);

    const socket = io(CHAT_ORIGIN, { transports: ["websocket", "polling"] });

    function appendLog(nickname, text, isMe = false, isMeta = false) {
      const row = document.createElement("div");
      if (isMeta) {
        row.className = "row meta"; row.textContent = text;
      } else {
        row.className = "row" + (isMe ? " me" : "");
        row.innerHTML = `<strong>${nickname}:</strong> ${text.replace(/[&<>"']/g, m => ({'&': '&amp;','<': '&lt;','>': '&gt;','"': '&quot;',"'": '&#039;'}[m]))}`;
      }
      logEl.appendChild(row);
      logEl.scrollTop = logEl.scrollHeight;
    }

    socket.on("connect", () => {
      st.textContent = `연결됨 (${myNickname})`; st.className = "status ok";
      socket.emit("identify", { nickname: myNickname });
      appendLog("📡 시스템", "서버에 성공적으로 연결되었습니다.", false, true);
    });

    socket.on("receive_message", (data) => appendLog(data.nickname, data.message, data.nickname === myNickname, false));
    socket.on("disconnect", () => { st.textContent = "끊김"; st.className = "status err"; });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const t = input.value.trim();
      if (!t || !socket.connected) return;
      socket.emit("send_message", { message: t });
      input.value = "";
    });
  </script>
</body>
</html>
