<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>환자 채팅 (미리보기)</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4d;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3d8bfd; /* 환자 전용 파란색 포인트 */
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 1rem;
      background: var(--panel);
    }
    header h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
    }
    header .badge {
      font-size: 0.7rem;
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      background: rgba(61, 139, 253, 0.25);
      color: #9ec5ff;
      font-weight: 600;
    }
    header .meta {
      margin: 0;
      font-size: 0.78rem;
      color: var(--muted);
      width: 100%;
    }
    .log {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem 1rem;
      font-size: 0.88rem;
    }
    .row { 
      margin-bottom: 0.6rem; 
      line-height: 1.4; 
    }
    .me { 
      color: #9ec5ff; 
      text-align: right;
      background: rgba(61, 139, 253, 0.1);
      padding: 4px 8px;
      border-radius: 4px;
    }
    .meta { 
      color: var(--muted); 
      font-size: 0.75rem; 
      text-align: center; 
      margin: 10px 0;
      padding: 5px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .composer {
      border-top: 1px solid var(--border);
      padding: 0.65rem;
      display: flex;
      gap: 0.5rem;
      background: var(--panel);
    }
    .composer input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.5rem 0.75rem;
      font-size: 0.9rem;
    }
    .composer input:focus { outline: none; border-color: var(--accent); }
    .composer button {
      background: var(--accent);
      border: none;
      color: #fff;
      font-weight: 600;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .composer button:hover { filter: brightness(1.08); }
    .status {
      font-size: 0.75rem;
      color: var(--muted);
      margin-left: auto;
      padding: 0.3rem 0.5rem;
      border-radius: 3px;
      background: rgba(255, 107, 107, 0.2);
      color: #ff6b6b;
    }
    .status.ok { 
      background: rgba(61, 139, 253, 0.2);
      color: #9ec5ff; 
    }
  </style>
</head>
<body>
  <header>
    <h1>환자 모드</h1>
    <span class="badge">patient</span>
    <span class="status" id="st">연결 중…</span>
    <p class="meta" id="roomline">서버에 연결을 시도합니다...</p>
  </header>
  
  <div class="log" id="log"></div>
  
  <form class="composer" id="form">
    <input type="text" id="input" placeholder="메시지 입력 후 Enter" autocomplete="off" />
    <button type="submit">보내기</button>
  </form>

  <script>
    // 1. 서버 주소 설정 (상담사와 동일한 서버)
    const CHAT_ORIGIN = "https://ee-main.onrender.com"; 

    const logEl = document.getElementById("log");
    const st = document.getElementById("st");
    const input = document.getElementById("input");
    const form = document.getElementById("form");

    // 2. 환자 닉네임 로드 및 생성
    let myNickname = localStorage.getItem("patient_nickname");
    if (!myNickname) {
      myNickname = "환자_" + Math.floor(Math.random() * 1000);
      localStorage.setItem("patient_nickname", myNickname);
    }

    document.getElementById("roomline").textContent = "연결 서버: " + CHAT_ORIGIN;

    // 3. Socket 연결
    const socket = io(CHAT_ORIGIN, {
      transports: ["websocket", "polling"],
    });

    // 4. 화면에 메시지 그리는 함수 (상담사 코드와 동일한 구조)
    function appendLog(nickname, text, isMe = false, isMeta = false) {
      const row = document.createElement("div");
      if (isMeta) {
        row.className = "row meta";
        row.textContent = text;
      } else {
        row.className = "row" + (isMe ? " me" : "");
        // XSS 방지 처리
        const cleanText = text.replace(/[&<>"']/g, function(m) {
          return {'&': '&amp;','<': '&lt;','>': '&gt;','"': '&quot;',"'": '&#039;'}[m];
        });
        row.innerHTML = `<strong>${nickname}:</strong> ${cleanText}`;
      }
      logEl.appendChild(row);
      logEl.scrollTop = logEl.scrollHeight;
    }

    // 5. 서버 이벤트 리스너
    socket.on("connect", function () {
      st.textContent = "연결됨 (" + myNickname + ")";
      st.className = "status ok";
      // 상담사와 동일하게 identify로 닉네임 전송
      socket.emit("identify", { nickname: myNickname });
      appendLog("📡 시스템", "서버에 성공적으로 연결되었습니다.", false, true);
    });

    socket.on("receive_message", function (data) {
      const isMe = (data.nickname === myNickname);
      appendLog(data.nickname, data.message, isMe, false);
    });

    socket.on("disconnect", function () {
      st.textContent = "끊김";
      st.className = "status err";
      appendLog("📡 시스템", "서버와 연결이 끊어졌습니다.", false, true);
    });

    socket.on("connect_error", function () {
      st.textContent = "연결 실패";
      st.className = "status err";
    });

    // 6. 메시지 전송 로직
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const t = input.value.trim();
      if (!t) return;
      
      // 구형 chat_message 대신 상담사와 동일한 send_message 사용
      socket.emit("send_message", { message: t });
      input.value = "";
    });
  </script>
</body>
</html>
