<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>상담사 채팅 (닉네임 저장형)</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4d;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #2eb88a; /* 상담사 전용 초록색 포인트 */
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header h1 { margin: 0; font-size: 1rem; display: inline-block; }
    .badge {
      font-size: 0.7rem;
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      background: rgba(46, 184, 138, 0.25);
      color: #8ee8c8;
      margin-left: 5px;
    }
    .nickname-area { margin-top: 8px; display: flex; gap: 5px; align-items: center; }
    .nickname-area input { 
      background: var(--bg); border: 1px solid var(--border); color: #fff; 
      padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; width: 150px;
    }
    .nickname-area button { 
      background: var(--accent); color: #0f1419; border: none; 
      padding: 4px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; 
    }
    .log { flex: 1; overflow-y: auto; padding: 0.75rem 1rem; font-size: 0.88rem; }
    .row { margin-bottom: 0.6rem; line-height: 1.4; }
    .me { color: #8ee8c8; text-align: right; } /* 상담사 본인 메시지 색상 */
    .meta { color: var(--muted); font-size: 0.75rem; text-align: center; margin: 10px 0; }
    .composer {
      border-top: 1px solid var(--border);
      padding: 0.65rem;
      display: flex;
      gap: 0.5rem;
      background: var(--panel);
    }
    .composer input {
      flex: 1; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); padding: 0.5rem;
    }
    .composer button {
      background: var(--accent); border: none; color: #0f1419;
      font-weight: 600; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer;
    }
    .status { float: right; font-size: 0.75rem; }
    .status.ok { color: #6ee7b7; }
  </style>
</head>
<body>
  <header>
    <h1>상담사 모드</h1>
    <span class="badge">therapist</span>
    <span class="status" id="st">연결 중…</span>
    <div class="nickname-area">
      <input type="text" id="nicknameInput" placeholder="상담사 이름 입력">
      <button onclick="changeNickname()">이름 확정</button>
    </div>
  </header>

  <div class="log" id="log"></div>

  <form class="composer" id="form">
    <input type="text" id="input" placeholder="답장 입력..." autocomplete="off" />
    <button type="submit">보내기</button>
  </form>

  <script>
    const CHAT_ORIGIN = "https://ee-main.onrender.com";
    const logEl = document.getElementById("log");
    const st = document.getElementById("st");
    const input = document.getElementById("input");
    const nicknameInput = document.getElementById("nicknameInput");

    // 1. 상담사 전용 닉네임 로드 (환자와 분리됨)
    let myNickname = localStorage.getItem("therapist_nickname");
    if (!myNickname) {
        myNickname = "상담사_" + Math.floor(Math.random() * 100);
        localStorage.setItem("therapist_nickname", myNickname);
    }
    nicknameInput.value = myNickname;

    const socket = io(CHAT_ORIGIN, {
      transports: ["websocket", "polling"],
    });

    function appendLog(nickname, text, isMe) {
      const row = document.createElement("div");
      row.className = "row" + (isMe ? " me" : "");
      row.innerHTML = `<strong>${nickname}:</strong> ${text}`;
      logEl.appendChild(row);
      logEl.scrollTop = logEl.scrollHeight;
    }

    // 2. 연결 및 식별
    socket.on("connect", function () {
      st.textContent = "연결됨 (" + myNickname + ")";
      st.className = "status ok";
      // 서버에 내 닉네임을 알림 (서버는 이 이름을 바탕으로 과거 내역을 줌)
      socket.emit("identify", { nickname: myNickname });
    });

    // 3. 메시지 수신 (실시간 + 과거 기록)
    socket.on("receive_message", function (data) {
      const isMe = (data.nickname === myNickname);
      appendLog(data.nickname, data.message, isMe);
    });

    // 4. 메시지 전송
    document.getElementById("form").addEventListener("submit", function (e) {
      e.preventDefault();
      const t = input.value.trim();
      if (!t) return;

      // 서버의 handle_send_message가 기다리는 키 'message' 사용
      socket.emit("send_message", { message: t });
      input.value = "";
    });

    // 5. 닉네임 변경 함수
    window.changeNickname = function() {
      const newName = nicknameInput.value.trim();
      if (newName && newName !== myNickname) {
        myNickname = newName;
        localStorage.setItem("therapist_nickname", newName);
        socket.emit("set_nickname", newName);
        
        // 화면 초기화 후 재접속하여 새 이름 기반으로 내역 다시 불러오기
        logEl.innerHTML = '<div class="meta">상담사 정보 갱신 중...</div>';
        location.reload(); 
      }
    };

    socket.on("disconnect", () => { st.textContent = "연결 끊김"; st.className = "status err"; });
  </script>
</body>
</html>
